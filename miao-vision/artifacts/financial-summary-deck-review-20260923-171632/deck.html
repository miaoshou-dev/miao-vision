  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--mv-serif); -webkit-font-smoothing: antialiased; }

  /* ── Present mode ── */
  body.present-mode { background: #141413; overflow: hidden; }
  .slide-viewport { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .slide-canvas { width: 1280px; height: 720px; transform-origin: center center; transform: scale(var(--slide-scale)); position: relative; }
  .slide {
    width: 1280px; height: 720px; background: var(--mv-paper);
    position: absolute; top: 0; left: 0;
    padding: 64px 80px 56px;
    display: flex; flex-direction: column;
    visibility: hidden; opacity: 0; transition: opacity 0.2s ease;
  }
  .slide.active { visibility: visible; opacity: 1; }

  /* ── Nav bar ── */
  .slide-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 48px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: rgba(20,20,19,0.72); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.2s; z-index: 100;
  }
  .slide-nav:hover { opacity: 1; }
  .slide-nav button {
    background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.65);
    font-size: 13px; padding: 4px 10px; border-radius: 3px;
    font-family: var(--mv-mono); transition: color 0.15s, background 0.15s;
  }
  .slide-nav button:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .slide-counter { color: rgba(255,255,255,0.4); font-family: var(--mv-mono); font-size: 12px; min-width: 56px; text-align: center; }

  /* ── Shared slide elements ── */
  .slide-eyebrow { font-family: var(--mv-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 3px; color: var(--mv-muted); margin-bottom: 14px; }
  .slide-title { font-family: var(--mv-serif); font-size: 50px; font-weight: 500; line-height: 1.1; letter-spacing: -0.6px; color: var(--mv-ink); margin-bottom: 24px; max-width: 19ch; overflow-wrap: anywhere; }
  .slide-claim { font-family: var(--mv-serif); font-size: 21px; line-height: 1.45; color: var(--mv-soft); margin-bottom: 18px; max-width: 52ch; overflow-wrap: anywhere; }
  .slide-pts { list-style: none; counter-reset: pts; }
  .slide-pts li { counter-increment: pts; font-size: 16px; line-height: 1.55; color: var(--mv-soft); padding-left: 22px; position: relative; margin-bottom: 10px; }
  .slide-pts li::before { content: counter(pts) "."; position: absolute; left: 0; color: var(--mv-brand); font-weight: 500; font-family: var(--mv-mono); font-size: 13px; }
  .slide-callout { border-left: 2px solid var(--mv-brand); padding: 8px 0 8px 16px; font-family: var(--mv-serif); font-size: 15px; line-height: 1.55; color: var(--mv-soft); margin-top: auto; }
  .slide-recommendation { border-left: 2px solid var(--mv-brand); padding: 7px 0 7px 14px; font-family: var(--mv-serif); font-size: 14px; line-height: 1.45; color: var(--mv-soft); margin-top: 10px; }
  .slide-caveat { position: absolute; left: 80px; right: 80px; bottom: 38px; font-family: var(--mv-mono); font-size: 9px; line-height: 1.35; color: var(--mv-muted); }
  .slide-annotation { font-family: var(--mv-serif); font-size: 14px; color: var(--mv-muted); line-height: 1.55; margin-bottom: 14px; font-style: italic; }
  .slide-quote-focus { justify-content: center; }
  .slide-quote-focus blockquote { font-family: var(--mv-serif); font-size: 46px; line-height: 1.2; color: var(--mv-ink); max-width: 22ch; }
  .quote-source { margin-top: 28px; font-family: var(--mv-mono); font-size: 12px; color: var(--mv-muted); }
  .narrative-comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; flex: 1; }
  .narrative-comparison > div { border-top: 2px solid var(--mv-brand); padding-top: 22px; }
  .decision-request { font-family: var(--mv-serif); font-size: 34px; line-height: 1.25; color: var(--mv-ink); max-width: 28ch; margin-bottom: 28px; }
  .decision-limit { margin-top: auto; font-family: var(--mv-mono); font-size: 11px; color: var(--mv-muted); }
  .slide-body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
  .slide-chart-full { display: flex; align-items: center; overflow: hidden; }
  .slide-chart-full svg, .slide-chart-full .miao-table-wrap { width: 100%; }

  /* ── Metrics ── */
  .slide-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding-top: 14px; border-top: 0.5px dotted var(--mv-border); margin-bottom: 20px; }
  .slide-metric { flex: 1; display: flex; flex-direction: column; gap: 5px; padding-right: 24px; }
  .slide-metric .v { font-family: var(--mv-serif); font-size: 42px; font-weight: 500; color: var(--mv-brand); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
  .slide-metric .l { font-family: var(--mv-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--mv-muted); }

  /* ── Cover ── */
  .slide-cover { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; height: 100%; }
  .slide-cover-left { display: flex; flex-direction: column; }
  .slide-cover h1 { font-family: var(--mv-serif); font-size: 56px; font-weight: 500; line-height: 1.05; letter-spacing: -1px; color: var(--mv-ink); margin-bottom: 14px; max-width: 12ch; overflow-wrap: anywhere; }
  .slide-cover .sub { font-size: 18px; color: var(--mv-soft); line-height: 1.5; margin-bottom: 22px; max-width: 34ch; overflow-wrap: anywhere; }
  .slide-cover .line { width: 48px; height: 2px; background: var(--mv-brand); margin-bottom: 14px; }
  .slide-cover .meta { font-family: var(--mv-mono); font-size: 11px; color: var(--mv-muted); letter-spacing: 0.5px; }
  .slide-cover-right { display: flex; align-items: center; justify-content: center; }
  .slide-mark { font-family: var(--mv-mono); font-size: 10px; color: var(--mv-brand); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; }

  /* ── Title-only ── */
  .slide-title-only { justify-content: center; }

  /* ── Ending ── */
  .slide-ending { justify-content: center; align-items: center; text-align: center; }
  .slide-ending h2 { font-family: var(--mv-serif); font-size: 52px; font-weight: 500; color: var(--mv-ink); letter-spacing: -0.8px; margin-bottom: 14px; }
  .slide-ending .line { width: 48px; height: 1.5px; background: var(--mv-brand); margin: 0 auto 14px; }
  .slide-ending .sub { font-size: 17px; color: var(--mv-soft); max-width: 44ch; line-height: 1.45; }

  /* ── Footer ── */
  .slide-page-num { position: absolute; bottom: 18px; right: 28px; font-family: var(--mv-mono); font-size: 10px; color: var(--mv-muted); font-variant-numeric: tabular-nums; }
  .slide-footer-mark { position: absolute; bottom: 18px; left: 28px; font-family: var(--mv-mono); font-size: 10px; color: var(--mv-muted); letter-spacing: 1px; text-transform: uppercase; }

  /* ── Table styles inside slide ── */
  .miao-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .miao-table-wrap { max-height: 430px; overflow: hidden; }
  .miao-table caption { caption-side: top; text-align: left; padding: 0 0 10px; color: var(--mv-muted); font-family: var(--mv-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
  .miao-table th { border-bottom: 1px solid var(--mv-border); padding: 7px 12px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--mv-muted); font-family: var(--mv-mono); }
  .miao-table td { border-bottom: 1px solid var(--mv-border); padding: 8px 12px; color: var(--mv-soft); font-variant-numeric: tabular-nums; }
  .miao-table tbody tr:last-child td { border-bottom: none; }

  /* ── Print mode ── */
  @media print {
    body { background: var(--mv-paper); }
    .slide-viewport { display: block; }
    .slide-canvas { transform: none !important; width: auto; height: auto; }
    .slide { width: 13.333in; height: 7.5in; position: relative; visibility: visible !important; opacity: 1 !important; break-after: page; page-break-after: always; animation: none !important; transition: none !important; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    .slide-nav { display: none !important; }
  }
  @page { size: 13.333in 7.5in; margin: 0; background: var(--mv-paper, #f5f4ed); }
</style>

(function() {

  var counter = document.getElementById('slide-counter');
  var total = slides.length;
  var current = 0;

  function setScale() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    var canvas = document.querySelector('.slide-canvas');
    if (canvas) { canvas.style.transform = 'scale(' + s + ')'; }
  }

  function goTo(n) {
    slides[current].classList.remove('active');
    current = Math.max(0, Math.min(n, total - 1));
    slides[current].classList.add('active');
    if (counter) counter.textContent = (current + 1) + ' / ' + total;
  }

  document.addEventListener('keydown', function(e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    var inInput = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
    if (e.key === 'ArrowRight' || e.key === ' ') { if (!inInput) { e.preventDefault(); goTo(current + 1); } }
    else if (e.key === 'ArrowLeft') { if (!inInput) { e.preventDefault(); goTo(current - 1); } }

      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function() {});
      else document.exitFullscreen().catch(function() {});

    var axisLayout = miaoData.categoryAxisLayout(chartRows.map(function(row) { return String(row[xField] == null ? '' : row[xField]); }), width - 72 - rightMargin, hasSeries);
    var height = (chart.style && typeof chart.style.height === 'number') ? chart.style.height : (axisLayout.rotate ? 460 : 420);
    var margin = { top: 24, right: rightMargin, bottom: axisLayout.bottomMargin, left: 72 };
    var chartWidth = width - margin.left - margin.right;
    var chartHeight = height - margin.top - margin.bottom;
    var values = chartRows.map(function(row) { return Number(row[yField]); }).filter(Number.isFinite);
    var yMax = Math.max.apply(null, values.concat([1]));
    var gap = 8;

    if (!colorField) {
      var barWidth = Math.max(8, (chartWidth - gap * Math.max(chartRows.length - 1, 0)) / Math.max(chartRows.length, 1));
      var body = chartRows.map(function(row, index) {
        var value = Number(row[yField]) || 0;
        var barHeight = value / yMax * chartHeight;
        var x = margin.left + index * (barWidth + gap);
        var y = margin.top + chartHeight - barHeight;
        var label = String(row[xField] == null ? '' : row[xField]);
        return '<g><rect ' + markAttrs(chartId, xField, row[xField], index, label + ': ' + value) +
          ' x="' + fixed(x) + '" y="' + fixed(y) + '" width="' + fixed(barWidth) + '" height="' + fixed(barHeight) +
          '" rx="3" fill="' + color(index) + '" />' +
          miaoData.renderBarAxisLabel(label, x + barWidth / 2, margin.top + chartHeight + (axisLayout.rotate ? 34 : 18), axisLayout) + '</g>';
      }).join('');
      return svgFrame(width, height, body);
    }

    var colorValues = miaoData.uniqueValues(chartRows, colorField);
    var xValues = miaoData.uniqueValues(chartRows, xField);
    var rowMap = new Map();
    chartRows.forEach(function(row) {
      rowMap.set(String(row[xField]) + '|' + String(row[colorField]), Number(row[yField]) || 0);
    });
    var barMode = chart.style && chart.style.barMode;
    var stackColors = colorValues.map(function(_, ci) { return color(ci); });

    if (barMode === 'stacked') {
      var xBarWidth = Math.max(8, (chartWidth - gap * Math.max(xValues.length - 1, 0)) / Math.max(xValues.length, 1));
      var body = xValues.map(function(xVal, xi) {
        var accumY = 0;
        return colorValues.map(function(cVal, ci) {
          var raw = rowMap.get(String(xVal) + '|' + String(cVal)) || 0;
          var barHeight = raw / yMax * chartHeight;
          var x = margin.left + xi * (xBarWidth + gap);
          var y = margin.top + chartHeight - accumY - barHeight;
          accumY += barHeight;
          return '<rect ' + markAttrs(chartId, xField, xVal, xi * colorValues.length + ci, xVal + ', ' + cVal + ': ' + raw) +

    }

    var groupWidth = (chartWidth - gap * Math.max(xValues.length - 1, 0)) / Math.max(xValues.length, 1);
    var barWidth = Math.max(4, (groupWidth - gap * Math.max(colorValues.length - 1, 0)) / Math.max(colorValues.length, 1));
    var groupStartX = (groupWidth - (barWidth * colorValues.length + gap * Math.max(colorValues.length - 1, 0))) / 2;
    var xLabels = [];

    var body = xValues.map(function(xVal, xi) {
      var baseX = margin.left + xi * (groupWidth + gap) + groupStartX;
      xLabels.push(miaoData.renderBarAxisLabel(xVal, baseX + groupWidth / 2 - gap / 2, margin.top + chartHeight + 34, axisLayout));
      return colorValues.map(function(cVal, ci) {
        var raw = rowMap.get(String(xVal) + '|' + String(cVal)) || 0;
        var barHeight = raw / yMax * chartHeight;
        var x = baseX + ci * (barWidth + gap);
        var y = margin.top + chartHeight - barHeight;
        return '<rect ' + markAttrs(chartId, xField, xVal, xi * colorValues.length + ci, xVal + ', ' + cVal + ': ' + raw) +
          ' x="' + fixed(x) + '" y="' + fixed(y) + '" width="' + fixed(barWidth) + '" height="' + fixed(barHeight) +
          '" rx="2" fill="' + stackColors[ci] + '" />';
      }).join('');
    }).join('');

    return svgFrame(width, height, body + xLabels.join('') + miaoData.renderLegend(width, margin.top, colorValues));
  };

  miaoData.categoryAxisLayout = function(labels, plotWidth, forceRotate) {
    var slotWidth = plotWidth / Math.max(labels.length, 1);
    var longest = labels.reduce(function(max, label) { return Math.max(max, label.length); }, 0);
    var rotate = Boolean(forceRotate) || longest * categoryAxisDefaults.estimatedCharacterWidth + categoryAxisDefaults.minimumLabelGap > slotWidth;
    var horizontalFit = Math.max(4, Math.floor((slotWidth - categoryAxisDefaults.minimumLabelGap) / categoryAxisDefaults.estimatedCharacterWidth));
    return { rotate:rotate, bottomMargin:rotate ? categoryAxisDefaults.rotatedBottomMargin : categoryAxisDefaults.horizontalBottomMargin, maxLabelLength:rotate ? categoryAxisDefaults.rotatedMaxLength : Math.min(categoryAxisDefaults.horizontalMaxLength,horizontalFit), rotationDegrees:categoryAxisDefaults.rotationDegrees };
  };

  miaoData.renderBarAxisLabel = function(value, x, y, layout) {
    var raw = String(value == null ? '' : value);
    var label = raw.length > layout.maxLabelLength ? raw.slice(0, layout.maxLabelLength - 3) + '...' : raw;
    var transform = layout.rotate ? ' transform="rotate(' + layout.rotationDegrees + ' ' + fixed(x) + ' ' + fixed(y) + ')"' : '';
    return '<text x="' + fixed(x) + '" y="' + fixed(y) + '" text-anchor="' + (layout.rotate ? 'end' : 'middle') + '"' + transform + ' fill="' + escapeAttr(runtimeTheme.labelColor) + '" font-size="11">' + escapeHtml(label) + '</text>';
  };

  miaoData.renderXY = function(chart, chartRows, chartId) {

    var yField = (chart.encoding && chart.encoding.y && chart.encoding.y.field) || '';
    var width = (chart.style && typeof chart.style.width === 'number') ? chart.style.width : 720;
    var height = (chart.style && typeof chart.style.height === 'number') ? chart.style.height : 420;
    var margin = { top: 24, right: 24, bottom: 48, left: 64 };
    var w = width - margin.left - margin.right, h = height - margin.top - margin.bottom;
    var values = chartRows.map(function(row) { return Number(row[yField]); }).filter(Number.isFinite);
    if (!values.length) return miaoData.renderNoData();
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (min === max) { min = Math.min(0, min); max = max || 1; }
    var points = chartRows.map(function(row, index) {
      var x = margin.left + (chartRows.length <= 1 ? w / 2 : index / (chartRows.length - 1) * w);
      var value = Number(row[yField]);
      var y = margin.top + h - ((value - min) / (max - min || 1) * h);

    if (chart.type !== 'scatter') body += '<path d="' + line + '" fill="none" stroke="' + color(0) + '" stroke-width="3" />';
    body += points.map(function(point) { var label=String(point.row[xField] == null ? '' : point.row[xField]); return '<circle ' + markAttrs(chartId,xField,point.row[xField],point.index,label+': '+point.value) + ' cx="'+fixed(point.x)+'" cy="'+fixed(point.y)+'" r="5" fill="'+color(0)+'" />'; }).join('');

  };

  miaoData.renderBigValue = function(chart, chartRows) {
    var field = (chart.encoding && chart.encoding.value && chart.encoding.value.field) || '';
    var value = chartRows[0] && chartRows[0][field];
    return '<div class="miao-bigvalue"><div style="font-size:42px;font-weight:700">' + escapeHtml(value == null ? '—' : String(value)) + '</div><div class="miao-view-derived">Current filter</div></div>';
  };

  miaoData.renderNoData = function() { return '<div class="miao-no-data">No data for the current view</div>'; };

  miaoData.renderPie = function(chart, chartRows, chartId) {
    var labelField = (chart.encoding && chart.encoding.label && chart.encoding.label.field) || '';
    var valueField = (chart.encoding && chart.encoding.value && chart.encoding.value.field) || '';
    var width = (chart.style && typeof chart.style.width === 'number') ? chart.style.width : 720;
    var height = (chart.style && typeof chart.style.height === 'number') ? chart.style.height : 420;

    var cy = height / 2;
    var outerR = Math.min(width, height) * 0.34;
    var innerR = (chart.style && typeof chart.style.innerRadius === 'number' ? chart.style.innerRadius : 0) * outerR;

  miaoData.renderTable = function(chart, chartRows, chartId, sortState) {

    if (sortState && sortState.field && sortState.order) {
      var order = sortState.order === 'asc' ? 1 : -1;
      chartRows = chartRows.slice().sort(function(a, b) {
        var an = Number(a[sortState.field]);
        var bn = Number(b[sortState.field]);
        if (Number.isFinite(an) && Number.isFinite(bn)) return (an - bn) * order;
        return String(a[sortState.field] || '').localeCompare(String(b[sortState.field] || '')) * order;
      });
    }

    var columns = Object.keys(chartRows[0] || {}).slice(0, 8);
    var markField = (chart.encoding && chart.encoding.label && chart.encoding.label.field) ||
      (chart.encoding && chart.encoding.x && chart.encoding.x.field) || columns[0] || '';
    var thead = '<thead><tr>' +
      columns.map(function(col) {
        var attrs = '';
        var indicator = '';
        if (sortable) {
          var active = sortState && sortState.field === col;
          var order = active ? sortState.order : '';

      '</tr></thead>';
    var tbody = '<tbody>' + chartRows.slice(0, 20).map(function(row, index) {
      return '<tr ' + markAttrs(chartId, markField, row[markField], index, String(row[markField] || 'Row')) + '>' +
        columns.map(function(col) { return '<td>' + escapeHtml(row[col] == null ? '' : String(row[col])) + '</td>'; }).join('') +
        '</tr>';
    }).join('') + '</tbody>';
    return '<div class="miao-table-wrap"><table class="miao-table">' + thead + tbody + '</table></div>';
  };

  miaoData.renderDetailTable = function(selectedRows, chartId, allRows) {
    var visible = selectedRows.slice(0, 100);
    var columns = Object.keys(visible[0] || allRows[0] || {}).slice(0, 8);
    if (!columns.length) return '<div class="miao-detail-title">No rows</div>';
    return '<div class="miao-detail-title">' + escapeHtml(chartId || 'Detail') + ': ' + selectedRows.length + ' rows</div>' +
      '<table><thead><tr>' + columns.map(function(col) { return '<th>' + escapeHtml(col) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + visible.map(function(row) {
        return '<tr>' + columns.map(function(col) { return '<td>' + escapeHtml(row[col] == null ? '' : String(row[col])) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  };

  window.miaoData = miaoData;
})();
</script>

  <script>
(function() {
  var md = window.miaoData;
  if (!md) return;
  var specEl = document.getElementById('miao-viz-deck');
  var dataEl = document.getElementById('miao-viz-data');
  if (!specEl || !dataEl) return;

  var spec = JSON.parse(specEl.textContent || '{}');
  var rows = JSON.parse(dataEl.textContent || '[]');
  var filters = (spec.interactions && spec.interactions.globalFilters) || [];
  var state = { filters: {}, selection: null, sort: {}, drilldown: null };

  var tooltip = null;
  var filterPanel = null;
  var filterBtn = null;
  var overlay = null;

  function createTooltip() {
    var el = document.createElement('div');
    el.className = 'miao-tooltip';
    el.hidden = true;
    document.body.appendChild(el);
    return el;
  }

  function createOverlay() {
    var el = document.createElement('div');
    el.className = 'deck-overlay';
    el.addEventListener('click', function() { closeFilterPanel(); });
    document.body.appendChild(el);
    return el;
  }

  function openFilterPanel() {
    filterPanel.classList.add('open');
    filterBtn.classList.add('active');
    overlay.classList.add('visible');
  }

  function closeFilterPanel() {
    filterPanel.classList.remove('open');
    filterBtn.classList.remove('active');
    overlay.classList.remove('visible');
  }

  function toggleFilterPanel() {
    if (filterPanel.classList.contains('open')) {
      closeFilterPanel();
    } else {
      openFilterPanel();
    }
  }

  function renderFilterPanel() {
    if (!filters.length) return;
    tooltip = createTooltip();
    overlay = createOverlay();

    filterPanel = document.createElement('div');
    filterPanel.className = 'deck-filter-panel';
    filterPanel.innerHTML =
      '<div class="deck-filter-header">' +
      '  <span>Filters</span>' +
      '  <button class="deck-filter-close" id="deck-filter-close">&times;</button>' +
      '</div>' +
      '<div class="deck-filter-body" id="deck-filter-body"></div>' +
      '<div class="deck-filter-footer">' +
      '  <button class="miao-reset" id="deck-filter-reset">Reset</button>' +
      '</div>';
    document.body.appendChild(filterPanel);

    document.getElementById('deck-filter-close').addEventListener('click', closeFilterPanel);

    var body = document.getElementById('deck-filter-body');
    filters.forEach(function(filter) {
      body.appendChild(filter.type === 'range' ? renderRangeFilter(filter) : renderSelectFilter(filter));
    });

    document.getElementById('deck-filter-reset').addEventListener('click', function() {
      state.filters = {};
      state.selection = null;
      state.drilldown = null;
      filterPanel.querySelectorAll('select,input').forEach(function(el) { el.value = ''; el.checked = false; });
      updateActiveSlide();
    });

    filterBtn = document.getElementById('btn-filter');
    if (filterBtn) {
      filterBtn.addEventListener('click', toggleFilterPanel);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && filterPanel.classList.contains('open')) {
        closeFilterPanel();
      }
    });
  }

  function renderSelectFilter(filter) {
    var wrap = document.createElement('div');
    wrap.className = 'miao-filter';
    var label = document.createElement('label');
    label.textContent = filter.field;
    wrap.appendChild(label);
    if (filter.multiSelect) {
      renderMultiSelect(wrap, filter);
    } else {
      renderSingleSelect(wrap, filter);
    }
    return wrap;
  }

  function renderSingleSelect(wrap, filter) {
    var values = uniqueValues(filter.field);
    if (values.length >= 20) {
      var input = document.createElement('input');
      input.className = 'miao-filter-search';
      input.placeholder = 'Search ' + filter.field + '...';
      input.setAttribute('list', 'miao-dk-' + md.escapeAttr(filter.field));
      var datalist = document.createElement('datalist');
      datalist.id = 'miao-dk-' + md.escapeAttr(filter.field);
      values.forEach(function(v) {
        var opt = document.createElement('option');
        opt.value = v;
        datalist.appendChild(opt);
      });
      input.addEventListener('change', function() {
        state.filters[filter.field] = input.value;
        updateActiveSlide();
      });
      wrap.appendChild(input);
      wrap.appendChild(datalist);
    } else {
      var select = document.createElement('select');
      select.innerHTML = '<option value="">All</option>' + values.map(function(value) {
        return '<option value="' + md.escapeAttr(value) + '">' + md.escapeHtml(value) + '</option>';
      }).join('');
      select.addEventListener('change', function() {
        state.filters[filter.field] = select.value;
        updateActiveSlide();
      });
      wrap.appendChild(select);
    }
  }

  function renderMultiSelect(wrap, filter) {
    var values = uniqueValues(filter.field);
    state.filters[filter.field] = state.filters[filter.field] || [];
    if (values.length >= 20) {
      renderSearchableMulti(wrap, filter, values);
    } else {
      renderCheckboxes(wrap, filter, values);
    }
  }

  function renderCheckboxes(wrap, filter, values) {
    var container = document.createElement('div');
    container.className = 'miao-filter-checks';
    values.forEach(function(v) {
      var labelEl = document.createElement('label');
      labelEl.className = 'miao-chip';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = v;
      cb.addEventListener('change', function() {
        var arr = state.filters[filter.field] || [];
        if (cb.checked) {
          if (arr.indexOf(v) === -1) arr.push(v);
        } else {
          var idx = arr.indexOf(v);
          if (idx !== -1) arr.splice(idx, 1);
        }
        updateActiveSlide();
      });
      labelEl.appendChild(cb);
      labelEl.appendChild(document.createTextNode(' ' + v));
      container.appendChild(labelEl);
    });
    wrap.appendChild(container);
  }

  function renderSearchableMulti(wrap, filter, values) {
    var searchInput = document.createElement('input');
    searchInput.className = 'miao-filter-search';
    searchInput.placeholder = 'Filter ' + filter.field + '...';
    var container = document.createElement('div');
    container.className = 'miao-filter-checks miao-filter-checks-scroll';
    function renderFiltered(term) {
      container.innerHTML = '';
      var filtered = term ? values.filter(function(v) { return v.toLowerCase().indexOf(term.toLowerCase()) !== -1; }) : values.slice(0, 100);
      filtered.forEach(function(v) {
        var labelEl = document.createElement('label');
        labelEl.className = 'miao-chip';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = v;
        var arr = state.filters[filter.field] || [];
        cb.checked = arr.indexOf(v) !== -1;
        cb.addEventListener('change', function() {
          if (cb.checked) {
            if (arr.indexOf(v) === -1) arr.push(v);
          } else {
            var idx = arr.indexOf(v);
            if (idx !== -1) arr.splice(idx, 1);
          }
          updateActiveSlide();
        });
        labelEl.appendChild(cb);
        labelEl.appendChild(document.createTextNode(' ' + v));
        container.appendChild(labelEl);
      });
    }
    searchInput.addEventListener('input', function() { renderFiltered(searchInput.value); });
    renderFiltered('');
    wrap.appendChild(searchInput);
    wrap.appendChild(container);
  }

  function renderRangeFilter(filter) {
    var wrap = document.createElement('div');
    wrap.className = 'miao-filter';
    var label = document.createElement('label');
    label.textContent = filter.field;
    var pair = document.createElement('div');
    pair.className = 'miao-filter-range';
    var useDate = md.guessFieldType(rows, filter.field) === 'date';
    var min = document.createElement('input');
    var max = document.createElement('input');
    if (useDate) {
      min.type = 'date';
      max.type = 'date';
    } else {
      min.placeholder = 'Min';
      max.placeholder = 'Max';
    }
    [min, max].forEach(function(input) {
      input.addEventListener('input', function() {
        state.filters[filter.field] = [min.value, max.value];
        updateActiveSlide();
      });
    });
    pair.appendChild(min);
    pair.appendChild(max);
    wrap.appendChild(label);
    wrap.appendChild(pair);
    return wrap;
  }

  function uniqueValues(field) {
    return md.uniqueValues(rows, field, 200);
  }

  function getSlideCharts(slide) {
    return slide.querySelectorAll('[data-miao-chart]');
  }

  function getChartSpec(slideIndex, chartIndex) {
    var slide = spec.slides[slideIndex];
    if (!slide || !slide.charts) return null;
    return slide.charts[chartIndex] || null;
  }

  function getActiveSlide() {
    return document.querySelector('.slide.active');
  }

  function renderChart(container, chart, sourceRows) {
    if (!chart) return;
    var slot = container.querySelector('.miao-render-slot');
    if (!slot) return;
    var chartId = container.getAttribute('data-miao-chart');
    var data = sourceRows;
    if (state.drilldown && state.drilldown.targetId === chartId) {
      data = sourceRows.filter(function(row) {
        return String(row[state.drilldown.field] == null ? '' : row[state.drilldown.field]) === String(state.drilldown.value);
      });
    }
    var chartRows = md.prepareRows(data, chart);
    if (!chartRows.length) slot.innerHTML = md.renderNoData();
    else if (chart.type === 'bar' && chart.variant === 'diverging') slot.innerHTML = md.renderDivergingBar(chart, chartRows, chartId);
    else if (chart.type === 'bar') slot.innerHTML = md.renderBar(chart, chartRows, chartId);
    else if (['line','area','scatter'].indexOf(chart.type) !== -1) slot.innerHTML = md.renderXY(chart, chartRows, chartId);
    else if (chart.type === 'pie') slot.innerHTML = md.renderPie(chart, chartRows, chartId);
    else if (chart.type === 'bigvalue') slot.innerHTML = md.renderBigValue(chart, chartRows);
    else if (chart.type === 'table') {
      var sortState = state.sort[chartId] || null;
      slot.innerHTML = md.renderTable(chart, chartRows, chartId, sortState);
      if (chart.sortable) bindSortHeaders(container, chartId);
    }
  }

  function bindSortHeaders(container, chartId) {
    var handler = function(e) {
      var th = e.target.closest('th[data-sortable]');
      if (!th) return;
      var field = th.getAttribute('data-sort-field');
      if (!field) return;
      var current = state.sort[chartId];
      var newOrder;
      if (!current || current.field !== field) newOrder = 'asc';
      else if (current.order === 'asc') newOrder = 'desc';
      else newOrder = null;
      state.sort[chartId] = newOrder ? { field: field, order: newOrder } : null;
      updateActiveSlide();
    };
    container.onclick = handler;
  }

  function canSelect(chart) {
    return Boolean(chart && ((chart.interaction && chart.interaction.select) || chart.drilldownPreset));
  }

  function bindMarks() {
    document.querySelectorAll('.slide.active [data-miao-mark]').forEach(function(mark) {
      if (mark.getAttribute('data-miao-bound') === 'true') return;
      mark.setAttribute('data-miao-bound', 'true');
      var chart = getChartSpec(
        Number(mark.getAttribute('data-slide-index')),
        Number(mark.getAttribute('data-chart-index'))
      );
      mark.addEventListener('mouseenter', function(event) {
        var text = mark.getAttribute('data-tooltip');
        if (!text || !tooltip) return;
        tooltip.textContent = text;
        tooltip.hidden = false;
        moveTooltip(event);
      });
      mark.addEventListener('mousemove', moveTooltip);
      mark.addEventListener('mouseleave', function() { if (tooltip) tooltip.hidden = true; });
      mark.addEventListener('click', function() {
        var field = mark.getAttribute('data-field');
        var value = mark.getAttribute('data-value');
        if (!field) return;
        var chartId = mark.getAttribute('data-chart-id');
        if (chart && chart.drilldownChart) {
          var same = state.drilldown && String(state.drilldown.value) === String(value) && state.drilldown.field === field;
          state.drilldown = same ? null : { field: field, value: value, targetId: chart.drilldownChart, sourceId: chartId };
          if (state.drilldown) {
            var target = document.querySelector('[data-miao-chart="' + md.escapeAttr(chart.drilldownChart) + '"]');
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          updateActiveSlide();
          return;
        }
        if (!canSelect(chart)) return;
        state.selection = state.selection && state.selection.field === field && String(state.selection.value) === String(value)
          ? null
          : { field: field, value: value };
        updateActiveSlide();
      });
    });
  }

  function renderDrilldownBreadcrumb() {
    var activeSlide = getActiveSlide();
    if (!activeSlide) return;
    var existing = activeSlide.querySelector('.miao-drilldown-bar');
    if (!state.drilldown) {
      if (existing) existing.remove();
      return;
    }
    if (existing) existing.remove();
    var bar = document.createElement('div');
    bar.className = 'miao-drilldown-bar';
    bar.innerHTML = '<span class="miao-drilldown-label">Drilldown: </span>' +
      '<span class="miao-drilldown-chip">' + md.escapeHtml(state.drilldown.field) + ': ' + md.escapeHtml(String(state.drilldown.value)) +
      ' <button class="miao-drilldown-clear">&times;</button></span>';
    bar.querySelector('.miao-drilldown-clear').addEventListener('click', function(e) { e.stopPropagation(); state.drilldown = null; updateActiveSlide(); });
    activeSlide.insertBefore(bar, activeSlide.firstChild);
  }

  function updateActiveSlide() {
    var filtered = md.applyFilters(rows, filters, state.filters);
    var activeSlide = getActiveSlide();
    if (!activeSlide) return;

    getSlideCharts(activeSlide).forEach(function(container) {
      var slideIndex = Number(container.getAttribute('data-slide-index') || -1);
      var chartIndex = Number(container.getAttribute('data-chart-index') || 0);
      var chart = getChartSpec(slideIndex, chartIndex);
      renderChart(container, chart, filtered);
    });

    bindMarks();

    document.querySelectorAll('.slide.active [data-miao-mark]').forEach(function(mark) {
      var field = mark.getAttribute('data-field');
      var value = mark.getAttribute('data-value');
      var selected = state.selection && state.selection.field === field && String(state.selection.value) === String(value);
      mark.setAttribute('data-miao-selected', selected ? 'true' : 'false');
      mark.classList.toggle('miao-mark-hidden', Boolean((state.selection && !selected) || !markMatchesFilters(field, value)));
    });

    document.querySelectorAll('.slide.active [data-miao-chart]').forEach(function(container) {
      renderDetail(container, filtered);
    });

    renderDrilldownBreadcrumb();
    renderMetrics(filtered);
    renderViewState(filtered);
  }


  function renderMetrics(filtered) {
    document.querySelectorAll('.slide.active [data-miao-metric]').forEach(function(container) {
      var slide=spec.slides[Number(container.getAttribute('data-slide-index'))];
      var metric=slide && slide.metrics && slide.metrics[Number(container.getAttribute('data-metric-index'))];
      if(!metric) return;
      var chart={type:'bigvalue',encoding:{},data:metric.data||{}};
      var prepared=md.prepareRows(filtered,chart);
      var raw=metric.value;
      if(raw===undefined && prepared[0]) { var keys=Object.keys(prepared[0]); raw=prepared[0][keys[0]]; }
      var value=container.querySelector('.v'); if(value) value.textContent=raw==null?'—':String(raw);
      var label=container.querySelector('.l'); if(label) label.innerHTML=md.escapeHtml(metric.label)+' <span class="miao-view-derived">Current filter</span>';
    });
  }

  function renderViewState(filtered) {
    var activeSlide=getActiveSlide(); if(!activeSlide) return;
    var el=activeSlide.querySelector('.miao-view-state'); if(!el){el=document.createElement('div');el.className='miao-view-state';activeSlide.insertBefore(el,activeSlide.firstChild);}
    var active=Object.keys(state.filters).filter(function(key){var value=state.filters[key];return value!==''&&value!=null&&(!Array.isArray(value)||value.some(Boolean));});
    el.innerHTML='<span>View: '+filtered.length+' / '+rows.length+' rows</span>'+active.map(function(key){return '<span class="miao-chip">'+md.escapeHtml(key)+': '+md.escapeHtml(Array.isArray(state.filters[key])?state.filters[key].join(' – '):String(state.filters[key]))+'</span>';}).join('')+(active.length?'<button id="deck-view-copy">Copy view link</button><button id="deck-view-reset">Reset all</button>':'<span>Base evidence view</span>');
    var reset=el.querySelector('#deck-view-reset');if(reset)reset.onclick=function(){state.filters={};state.selection=null;state.drilldown=null;filterPanel&&filterPanel.querySelectorAll('select,input').forEach(function(input){input.value='';input.checked=false;});updateActiveSlide();};
    var copy=el.querySelector('#deck-view-copy');if(copy)copy.onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(location.href);};
    activeSlide.querySelectorAll('.slide-claim,.sub').forEach(function(claim){claim.setAttribute('data-view-scope',active.length?'base-evidence':'current');claim.title=active.length?'Claim is based on the complete dataset.':'';});
    try{location.hash=active.length?'miao='+encodeURIComponent(JSON.stringify({filters:state.filters})):'';}catch(_){}
  }


  function renderDetail(container, filtered) {
    var chartId = container.getAttribute('data-miao-chart');
    var detail = container.querySelector('.miao-detail');
    if (!detail) {
      detail = document.createElement('div');
      detail.className = 'miao-detail';
      container.appendChild(detail);
    }
    if (!state.selection) {
      detail.innerHTML = '';
      detail.hidden = true;
      return;
    }
    var selectedRows = filtered.filter(function(row) {
      return String(row[state.selection.field] == null ? '' : row[state.selection.field]) === String(state.selection.value);
    });
    detail.hidden = false;
    detail.innerHTML = md.renderDetailTable(selectedRows, chartId, filtered);
  }

  function moveTooltip(event) {
    if (tooltip) {
      tooltip.style.left = event.clientX + 'px';
      tooltip.style.top = event.clientY + 'px';
    }
  }

  function markMatchesFilters(field, value) {
    var activeFilters = filters.filter(function(filter) { return filter.field === field; });
    if (!activeFilters.length) return true;
    return activeFilters.every(function(filter) {
      var active = state.filters[filter.field];
      if (active == null || active === '' || (Array.isArray(active) && !active[0] && !active[1])) return true;
      if (filter.type === 'select') {
        if (Array.isArray(active)) {
          if (active.length === 0) return true;
          return active.indexOf(String(value == null ? '' : value)) !== -1;
        }
        return String(value == null ? '' : value) === String(active);
      }
      var current = md.comparableValue(value);
      if (current == null) return false;
      var min = md.comparableValue(active[0]);
      var max = md.comparableValue(active[1]);
      if (min != null && current < min) return false;
      if (max != null && current > max) return false;
      return true;
    });
  }

  function watchSlideChanges() {
    var canvas = document.querySelector('.slide-canvas');
    if (!canvas) return;
    var lastIndex = -1;
    var observer = new MutationObserver(function() {
      var active = getActiveSlide();
      if (!active) return;
      var idx = Array.prototype.indexOf.call(canvas.querySelectorAll('.slide'), active);
      if (idx === lastIndex) return;
      lastIndex = idx;
      updateActiveSlide();
    });
    observer.observe(canvas, {
      attributes: true,
      childList: true,
      subtree: true,
      attributeFilter: ['class']
    });
  }

  try { if(location.hash.indexOf('#miao=')===0) { var saved=JSON.parse(decodeURIComponent(location.hash.slice(6))); state.filters=saved.filters||{}; } } catch (_) {}
  var printFilters=null;
  window.addEventListener('beforeprint',function(){printFilters=JSON.parse(JSON.stringify(state.filters));state.filters={};updateActiveSlide();});
  window.addEventListener('afterprint',function(){state.filters=printFilters||{};printFilters=null;updateActiveSlide();});
  renderFilterPanel();
  updateActiveSlide();
  watchSlideChanges();
})();
</script>
</body>
</html>
