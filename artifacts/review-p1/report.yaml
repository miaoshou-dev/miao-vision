# Generated by: miao-viz block instantiate trend-ranking
# Block: trend-ranking (score: 1.00)
# Variables: primaryMeasure=sales, primaryDimension=region, timeField=order_date, topN=5
# IMPORTANT: Review field names, adjust variables, fill insights[] before validate

charts:
  - id: kpi_total_sales
    type: bigvalue
    title: Total sales
    data:
      transform:
        - type: aggregate
          measures:
            - field: sales
              op: sum
              as: total_sales
    encoding:
      value:
        field: total_sales
        type: quantitative
    provenance:
      evidence:
        - total
      derivedFrom:
        - $evidence:total.values.total_sales
      check: value_match
      claimArgs:
        value: $evidence:total.values.total_sales
        expected: $evidence:total.values.total_sales
  - id: trend_by_order_date
    type: line
    title: sales over order_date
    data:
      transform:
        - type: aggregate
          groupBy:
            - order_date
          measures:
            - field: sales
              op: sum
              as: total_sales
        - type: sort
          field: order_date
          order: asc
    encoding:
      x:
        field: order_date
        type: temporal
      y:
        field: total_sales
        type: quantitative
    provenance:
      evidence:
        - by_time
      derivedFrom:
        - $evidence:by_time.rows
  - id: ranking_by_region
    type: bar
    title: sales by region
    data:
      transform:
        - type: aggregate
          groupBy:
            - region
          measures:
            - field: sales
              op: sum
              as: total_sales
        - type: sort
          field: total_sales
          order: desc
        - type: limit
          value: 5
    encoding:
      x:
        field: region
        type: nominal
      y:
        field: total_sales
        type: quantitative
    provenance:
      evidence:
        - by_dimension
      derivedFrom:
        - $evidence:by_dimension.rows
insights:
  - type: total
    text: "Total sales: $evidence:total.values.total_sales"
    evidence:
      - total
    derivedFrom:
      - total
    check: evidence_ref_exists
    provenance:
      evidence:
        - total
      derivedFrom:
        - $evidence:total.values.total_sales
      check: value_match
      claimArgs:
        value: $evidence:total.values.total_sales
        expected: $evidence:total.values.total_sales
  - type: trend
    text: "sales trend (by order_date): from $evidence:by_time.rows[0].total_sales
      to $evidence:by_time.rows[last].total_sales. Period-over-period increased
      10.2%"
    evidence:
      - by_time
    derivedFrom:
      - by_time
    check: evidence_ref_exists
    provenance:
      evidence:
        - by_time
      derivedFrom:
        - $evidence:by_time.rows[0].total_sales
        - $evidence:by_time.rows[last].total_sales
      check: trend_periods
      claimArgs:
        series: $evidence:by_time.rows
        valueField: total_sales
        minimumPeriods: 3
  - type: rank
    text: "Top 5 region by sales: $evidence:by_dimension.rows[0].region at
      $evidence:by_dimension.rows[0].total_sales"
    evidence:
      - by_dimension
    derivedFrom:
      - by_dimension
    check: rank_position
    provenance:
      evidence:
        - by_dimension
      derivedFrom:
        - $evidence:by_dimension.rows[0].region
        - $evidence:by_dimension.rows[0].total_sales
      check: rank_position
      claimArgs:
        rows: $evidence:by_dimension.rows
        subjectField: region
        valueField: total_sales
        subject: $evidence:by_dimension.rows[0].region
        expectedRank: 1
        order: desc

