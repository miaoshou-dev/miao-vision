name: Publish Skill to GitHub Release

on:
  push:
    tags:
      - 'skill-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for creating releases and uploading assets

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build native CLI binaries
        run: npm run build:cli:native

      - name: Validate plugin release metadata
        run: npm run validate:plugin

      - name: Test shared CLI runtime
        run: npm run test:skill-runtime

      - name: Pack plugin and compatibility skill ZIP
        run: npm run pack:plugin && npm run pack:skill

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#skill-v}" >> "$GITHUB_OUTPUT"

      - name: Verify release versions
        run: |
          test "$(node -p "require('./packages/miao-viz-cli/package.json').version")" = "$(node -p "require('./skills/miao-vision/cli-compatibility.json').recommendedCliVersion")"
          test "$(node -p "require('./skills/miao-vision/cli-compatibility.json').pluginVersion")" = "${{ steps.version.outputs.version }}"
          test "$(node -p "require('./skills/miao-vision/cli-compatibility.json').releaseTag")" = "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Miao Vision Plugin v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Install

            Install `miao-vision-plugin.zip` in Codex, Claude Code, or OpenClaw.
            On first use, approve the matching CLI download into `~/.miao-vision/bin`.
            Plugin upgrades and uninstalls leave the shared CLI intact.

            `miao-vision-skill.zip` is retained as a lightweight compatibility
            channel for this release. See the install documents inside the bundle.
          files: |
            dist/plugins/miao-vision-plugin.zip
            dist/skills/miao-vision-skill.zip
            dist/native/miao-viz-*
          draft: false
          prerelease: false
